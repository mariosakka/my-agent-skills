name: validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch or commit to validate instead of the workflow ref
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      validated_sha: ${{ steps.validated-revision.outputs.sha }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_ref || github.ref }}

      - name: Capture validated revision
        id: validated-revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Check documentation and source/test changes
        if: github.event_name == 'pull_request'
        env:
          DOC_SYNC_BYPASS_REASON: "${{ github.actor == 'dependabot[bot]' && 'Docs-Not-Required: Dependency version update; full validation still runs.' || github.event.pull_request.body }}"
          TEST_SYNC_BYPASS_REASON: "${{ github.actor == 'dependabot[bot]' && 'Tests-Not-Required: Dependency version update; full validation still runs.' || github.event.pull_request.body }}"
        run: python scripts/check_docs_sync.py "${{ github.event.pull_request.base.sha }}" "$GITHUB_SHA"

      - name: Check documentation and source/test changes on push
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No previous commit to compare; skipping change-sync check on initial push."
            exit 0
          fi
          export DOC_SYNC_BYPASS_REASON="$(git log --format=%B "$BASE_SHA..$GITHUB_SHA")"
          export TEST_SYNC_BYPASS_REASON="$DOC_SYNC_BYPASS_REASON"
          python scripts/check_docs_sync.py "$BASE_SHA" "$GITHUB_SHA"

      - name: Skill lint and drift check
        run: bash scripts/validate.sh

      - name: PowerShell validation mirror
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Repository foundations audit
        run: python plugins/general/skills/repo-foundations/scripts/foundations_audit.py .

      - name: Skill unit tests
        run: |
          python -m pip install -r requirements-dev.txt
          bash scripts/run_tests.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: claude plugin validate
        run: claude plugin validate .

      - name: Install smoke test (temporary HOME)
        run: |
          export HOME="$(mktemp -d)"
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install general@mario-agent-skills
          claude plugin list | tee "$HOME/list.txt"
          grep -q general "$HOME/list.txt"

      - name: Muse plugin validate (best effort)
        continue-on-error: true
        run: |
          # No verified headless install for the Muse CLI yet. Add an install step here
          # once one is documented; until then this step is skipped with a notice.
          if ! command -v muse >/dev/null 2>&1; then
            echo "::notice::muse CLI not available on this runner; skipping muse plugins validate"
            exit 0
          fi
          for p in plugins/*/; do
            MUSE_EXPERIMENTAL_PLUGINS=1 muse plugins validate "$p" \
              || echo "::notice::muse plugins validate failed for $p (Muse manifest shape is unverified)"
          done

      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Scheduled validation failed ($(date -u +%F))" \
            --body "The weekly validate workflow failed. See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  auto-merge-release-please:
    needs: validate
    if: >-
      success() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.target_ref == 'release-please--branches--master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verify Release Please PR and squash-merge validated SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VALIDATED_SHA: ${{ needs.validate.outputs.validated_sha }}
        run: |
          branch=release-please--branches--master
          pr_json="$(gh pr list --state open --base master --head "$branch" \
            --json number,headRefName,headRefOid,author --jq '.[0]')"
          if [[ -z "$pr_json" || "$pr_json" == "null" ]]; then
            echo "No open Release Please PR; nothing to merge."
            exit 0
          fi

          author="$(jq -r '.author.login' <<<"$pr_json")"
          pr_sha="$(jq -r '.headRefOid' <<<"$pr_json")"
          pr_number="$(jq -r '.number' <<<"$pr_json")"
          if [[ "$author" != "app/github-actions" || "$pr_sha" != "$VALIDATED_SHA" ]]; then
            echo "Release PR identity/head changed after validation; refusing auto-merge." >&2
            exit 1
          fi

          gh pr merge "$pr_number" --squash --match-head-commit "$VALIDATED_SHA"
